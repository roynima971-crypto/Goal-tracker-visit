<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>Goal Tracker Dashboard</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1120;--panel:#141f33;--card:#1b2940;--line:#2c3b55;--text:#f1f5f9;--muted:#9aabc4;--blue:#60a5fa;--green:#34d399;--red:#fb7185;--amber:#fbbf24}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{border:0;border-radius:9px;padding:10px 15px;background:#3578e5;color:white;font-weight:700;cursor:pointer}button:hover{filter:brightness(1.12)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.secondary{background:#34445f}.danger{background:#9f3345}.success{background:#16744e}
    header{background:#101a2b;border-bottom:1px solid var(--line);padding:17px max(20px,calc((100% - 1120px)/2));display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}header h1{font-size:21px;margin:0;color:var(--blue)}header p{margin:3px 0 0;color:var(--muted);font-size:13px}.wrap{max-width:1120px;margin:auto;padding:26px 20px 50px}.section{background:var(--panel);border:1px solid #25344d;border-radius:15px;padding:22px;margin-bottom:18px}.section h2{font-size:18px;margin:0 0 15px}.hero{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.hero h2{font-size:22px;margin:0 0 4px}.muted,.small{color:var(--muted)}.small{font-size:13px}.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:20px 0}.stat{background:var(--card);border-radius:11px;padding:16px}.stat span{font-size:12px;color:var(--muted)}.stat strong{display:block;font-size:27px;margin-top:3px}.stat:nth-child(2) strong,.stat:nth-child(5) strong{color:var(--green)}.stat:nth-child(4) strong{color:var(--red)}.bar{height:9px;background:#2c3b55;border-radius:20px;overflow:hidden;margin:9px 0}.bar>div{height:100%;width:0;background:linear-gradient(90deg,#34d399,#60a5fa);transition:width .25s}.progress-label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
    .columns{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.task{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:10px;padding:15px;margin:10px 0}.task.done{border-left-color:var(--green);opacity:.88}.task.overdue{border-left-color:var(--red)}.task-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.task h3{margin:0;font-size:16px}.badge{display:inline-block;background:#30415c;border-radius:20px;padding:3px 9px;font-size:11px;color:#dbeafe;white-space:nowrap}.badge.done{background:#14532d;color:#bbf7d0}.badge.overdue{background:#7f1d1d;color:#fecaca}.task-meta{font-size:12px;color:var(--muted);margin:7px 0}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions button{font-size:12px;padding:7px 10px}.empty{padding:24px;text-align:center;color:var(--muted)}
    .form-wrap[hidden]{display:none}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.field.full{grid-column:1/-1}label{font-size:13px;color:#cbd5e1}input,textarea,select{display:block;width:100%;padding:10px 11px;margin:5px 0 12px;border:1px solid var(--line);border-radius:8px;background:#0b1120;color:var(--text)}textarea{min-height:75px;resize:vertical}.form-actions{display:flex;gap:8px}.deadline-item{padding:11px 0;border-bottom:1px solid var(--line)}.deadline-item:last-child{border:0}.deadline-date{font-size:12px;color:var(--amber)}canvas{display:block;width:100%;height:220px}.chart-note{font-size:12px;color:var(--muted)}
    @media(max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.columns{grid-template-columns:1fr}}@media(max-width:480px){.wrap{padding:15px 12px 35px}.section{padding:16px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.stats .stat:last-child{grid-column:span 2}}
  </style>
</head>
<body>
  <header><div><h1>🎯 Goal Tracker</h1><p>Small steps, meaningful progress.</p></div><div class="small" id="clock" aria-live="polite"></div></header>
  <main class="wrap">
    <section class="section">
      <div class="hero"><div><h2>Your dashboard</h2><div class="muted">A clear view of your goals, deadlines, and achievements.</div></div><button id="addTaskButton" type="button">＋ Add task</button></div>
      <div class="stats" aria-label="Goal statistics">
        <div class="stat"><span>Total tasks</span><strong id="total">0</strong></div><div class="stat"><span>Completed</span><strong id="completed">0</strong></div><div class="stat"><span>In progress</span><strong id="pending">0</strong></div><div class="stat"><span>Overdue</span><strong id="overdue">0</strong></div><div class="stat"><span>Success rate</span><strong id="successRate">0%</strong></div>
      </div>
      <div class="progress-label"><span>Overall goal progress</span><strong id="progressText">0%</strong></div><div class="bar" role="progressbar" aria-label="Overall goal progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="overallBar"></div></div>
    </section>

    <section class="section form-wrap" id="formSection" hidden>
      <h2 id="formHeading">＋ Add a task</h2>
      <form id="taskForm">
        <input type="hidden" id="editId">
        <div class="form-grid">
          <div class="field full"><label for="name">Task or goal name *</label><input id="name" required maxlength="120" placeholder="e.g. Read 20 pages"></div>
          <div class="field full"><label for="description">Description</label><textarea id="description" maxlength="500" placeholder="What do you want to accomplish?"></textarea></div>
          <div class="field"><label for="category">Category</label><select id="category"><option>Personal</option><option>Study</option><option>Health</option><option>Work</option><option>Other</option></select></div>
          <div class="field"><label for="priority">Priority</label><select id="priority"><option>High</option><option selected>Medium</option><option>Low</option></select></div>
          <div class="field"><label for="deadline">Deadline *</label><input id="deadline" type="date" required></div>
          <div class="field"><label for="progressInput">Progress (%)</label><input id="progressInput" type="number" min="0" max="100" value="0"></div>
        </div>
        <div class="form-actions"><button id="saveButton" type="submit">Save task</button><button id="cancelButton" class="secondary" type="button">Cancel</button></div>
      </form>
    </section>

    <div class="columns">
      <section class="section"><h2>📋 Your tasks</h2><div class="form-grid"><div><label for="filter">Filter</label><select id="filter"><option>All</option><option>In progress</option><option>Completed</option><option>Overdue</option></select></div><div><label for="search">Search</label><input id="search" type="search" placeholder="Find a task"></div></div><div id="taskList"></div></section>
      <section class="section"><h2>⏰ Upcoming deadlines</h2><div id="deadlines"></div></section>
    </div>
    <section class="section"><h2>📈 Goal achievement — last 7 days</h2><canvas id="achievementGraph" role="img" aria-label="Bar chart showing tasks completed during the last seven days"></canvas><div class="chart-note" id="graphSummary"></div></section>
  </main>
<script>
  const $ = id => document.getElementById(id);
  const STORAGE_KEY = 'personalGoalTasks';
  let tasks = [];
  try { const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); tasks = Array.isArray(saved) ? saved : []; } catch { tasks = []; }
  const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
  const isOverdue = task => !task.done && task.deadline && task.deadline < todayISO();
  const save = () => { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); render(); };
  function openForm(task) {
    $('formSection').hidden = false;
    $('formHeading').textContent = task ? '✏️ Edit task' : '＋ Add a task';
    $('saveButton').textContent = task ? 'Update task' : 'Save task';
    $('editId').value = task?.id || '';
    $('name').value = task?.name || '';
    $('description').value = task?.description || '';
    $('category').value = task?.category || 'Personal';
    $('priority').value = task?.priority || 'Medium';
    $('deadline').value = task?.deadline || todayISO();
    $('progressInput').value = task?.progress ?? 0;
    $('formSection').scrollIntoView({behavior:'smooth',block:'start'});
    $('name').focus({preventScroll:true});
  }
  function closeForm() { $('taskForm').reset(); $('editId').value = ''; $('progressInput').value = 0; $('formSection').hidden = true; }
  $('addTaskButton').addEventListener('click', () => openForm());
  $('cancelButton').addEventListener('click', closeForm);
  $('taskForm').addEventListener('submit', event => {
    event.preventDefault();
    const id = $('editId').value || (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()));
    const previous = tasks.find(task => task.id === id);
    const done = previous?.done || false;
    const progress = done ? 100 : Math.max(0, Math.min(100, Number($('progressInput').value) || 0));
    const task = {id, name:$('name').value.trim(), description:$('description').value.trim(), category:$('category').value, priority:$('priority').value, deadline:$('deadline').value, progress, done, completedAt:previous?.completedAt || ''};
    if (!task.name) return;
    if (previous) tasks = tasks.map(item => item.id === id ? task : item); else tasks.push(task);
    closeForm(); save();
  });
  function toggleDone(id) {
    tasks = tasks.map(task => task.id === id ? {...task, done:!task.done, progress:task.done ? Math.min(Number(task.progress)||0,99) : 100, completedAt:task.done ? '' : todayISO()} : task);
    save();
  }
  function editTask(id) { const task = tasks.find(item => item.id === id); if (task) openForm(task); }
  function deleteTask(id) { if (confirm('Delete this task?')) { tasks = tasks.filter(task => task.id !== id); save(); } }
  $('filter').addEventListener('change', render);
  $('search').addEventListener('input', render);
  function render() {
    const completed = tasks.filter(task => task.done).length;
    const overdue = tasks.filter(isOverdue).length;
    const inProgress = tasks.length - completed;
    const rate = tasks.length ? Math.round(completed / tasks.length * 100) : 0;
    $('total').textContent = tasks.length; $('completed').textContent = completed; $('pending').textContent = inProgress; $('overdue').textContent = overdue; $('successRate').textContent = `${rate}%`;
    $('progressText').textContent = `${rate}% complete`;
    $('overallBar').style.width = `${rate}%`;
    $('overallBar').parentElement.setAttribute('aria-valuenow', rate);

    const query = $('search').value.trim().toLowerCase();
    const filter = $('filter').value;
    const shown = tasks.filter(task => {
      const matchesFilter = filter === 'All' || (filter === 'Completed' && task.done) || (filter === 'Overdue' && isOverdue(task)) || (filter === 'In progress' && !task.done && !isOverdue(task));
      return matchesFilter && `${task.name} ${task.description} ${task.category}`.toLowerCase().includes(query);
    }).sort((a,b) => (a.deadline || '9999').localeCompare(b.deadline || '9999'));
    $('taskList').innerHTML = shown.length ? shown.map(task => `<article class="task ${task.done?'done':isOverdue(task)?'overdue':''}"><div class="task-head"><h3>${escapeHTML(task.name)}</h3><span class="badge ${task.done?'done':isOverdue(task)?'overdue':''}">${task.done?'Completed':isOverdue(task)?'Overdue':'In progress'}</span></div><div class="task-meta">${escapeHTML(task.category)} · ${escapeHTML(task.priority)} priority · Deadline: ${escapeHTML(task.deadline || 'Not set')}</div>${task.description?`<div class="small">${escapeHTML(task.description)}</div>`:''}<div class="bar"><div style="width:${task.done?100:Math.max(0,Math.min(100,Number(task.progress)||0))}%"></div></div><div class="small">Progress: ${task.done?100:Math.max(0,Math.min(100,Number(task.progress)||0))}%</div><div class="actions"><button class="success" onclick="toggleDone('${escapeHTML(task.id)}')">${task.done?'Reopen':'Mark complete'}</button><button class="secondary" onclick="editTask('${escapeHTML(task.id)}')">Edit</button><button class="danger" onclick="deleteTask('${escapeHTML(task.id)}')">Delete</button></div></article>`).join('') : '<div class="empty">No tasks match. Add a task to get started.</div>';

    const upcoming = tasks.filter(task => !task.done && task.deadline).sort((a,b) => a.deadline.localeCompare(b.deadline)).slice(0,5);
    $('deadlines').innerHTML = upcoming.length ? upcoming.map(task => `<div class="deadline-item"><strong>${escapeHTML(task.name)}</strong><div class="deadline-date">${isOverdue(task)?'Overdue · ':''}${escapeHTML(task.deadline)}</div></div>`).join('') : '<div class="empty">No upcoming deadlines. Add a deadline to a task.</div>';
    drawGraph();
  }
  function drawGraph() {
    const canvas = $('achievementGraph');
    const rect = canvas.getBoundingClientRect();
    if (!rect.width) return;
    const ratio = window.devicePixelRatio || 1;
    canvas.width = Math.round(rect.width * ratio); canvas.height = Math.round(220 * ratio);
    const ctx = canvas.getContext('2d'); ctx.scale(ratio, ratio);
    const width = rect.width, height = 220, pad = {left:32,right:12,top:15,bottom:32};
    ctx.clearRect(0,0,width,height);
    const days = [];
    for (let offset=6; offset>=0; offset--) { const date=new Date(); date.setHours(0,0,0,0); date.setDate(date.getDate()-offset); const iso=`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`; days.push({date,iso,count:tasks.filter(task=>task.done&&task.completedAt===iso).length}); }
    const max = Math.max(1,...days.map(day=>day.count)), plotH=height-pad.top-pad.bottom, plotW=width-pad.left-pad.right;
    ctx.font='11px system-ui'; ctx.textAlign='right'; ctx.textBaseline='middle';
    for(let i=0;i<=Math.min(max,4);i++){const y=pad.top+plotH-(i/Math.min(max,4))*plotH;ctx.strokeStyle='#2c3b55';ctx.beginPath();ctx.moveTo(pad.left,y);ctx.lineTo(width-pad.right,y);ctx.stroke();ctx.fillStyle='#9aabc4';ctx.fillText(String(Math.round(i*max/Math.min(max,4))),pad.left-7,y);}
    const slot=plotW/7, barW=Math.min(34,slot*.58);
    days.forEach((day,index)=>{const x=pad.left+index*slot+(slot-barW)/2;const barH=day.count/max*(plotH-4);ctx.fillStyle='#60a5fa';ctx.beginPath();ctx.roundRect(x,pad.top+plotH-barH,barW,barH,5);ctx.fill();ctx.fillStyle='#9aabc4';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText(day.date.toLocaleDateString(undefined,{weekday:'short'}),x+barW/2,height-pad.bottom+9);});
    const last7=days.reduce((sum,day)=>sum+day.count,0);
    $('graphSummary').textContent = `${last7} task${last7===1?'':'s'} completed in the last 7 days. Completion history is saved on this device.`;
  }
  function updateClock(){ $('clock').textContent = new Date().toLocaleString([], {weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); }
  updateClock(); setInterval(updateClock,60000); render(); window.addEventListener('resize',drawGraph);
</script>
</body>
</html>
